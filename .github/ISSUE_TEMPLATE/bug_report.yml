name: Сообщить об ошибке
description: Воспроизводимая проблема на arena.hs-manacost.ru
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Не добавляйте в форму пароли, токены, cookies или личные данные.
        Уязвимости отправляйте приватно по инструкции из SECURITY.md.
  - type: input
    id: page
    attributes:
      label: Страница
      description: Полный публичный URL, на котором возникла проблема.
      placeholder: https://arena.hs-manacost.ru/...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
      description: Что должно было произойти?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
      description: Что произошло вместо этого?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Как воспроизвести
      description: Короткая последовательность действий.
      placeholder: |
        1. Открыть…
        2. Выбрать…
        3. Нажать…
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: Устройство, ОС, браузер и примерный размер окна.
      placeholder: iPhone 15, iOS 19, Safari
  - type: textarea
    id: context
    attributes:
      label: Дополнительный контекст
      description: Скриншот, запись экрана или безопасный фрагмент сообщения об ошибке.
