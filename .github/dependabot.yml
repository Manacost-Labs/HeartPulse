version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "03:20"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      # Browser QA (puppeteer) and the production scraper (puppeteer-core)
      # must move together: tests/security-tooling-contract.test.mjs pins
      # one version for both, so split group PRs always fail.
      puppeteer:
        patterns:
          - puppeteer
          - puppeteer-core
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # The types follow the runtime: production and CI run Node.js 22.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # A TypeScript major is a migration of its own: 7.0.2 reported 177
      # errors in 73 files here on 2026-09-30.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Vite 8 builds with Rolldown, which links the styles shared with lazy
      # stories ahead of the entry stylesheet. The cascade of the Storybook
      # build then differs from the site and three browser tests fail.
      - dependency-name: vite
        versions:
          - 8.x
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "03:40"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
