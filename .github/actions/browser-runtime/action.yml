name: Cache installed browser runtime
description: Restore the runner's exact Chrome package into writable, freshly populated files.
inputs:
  save-cache:
    description: Seed a missing cache from the installed package; the build or main refresh job writes.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Identify installed Chrome package
      id: package
      shell: bash
      run: |
        version=$(dpkg-query -W -f='${Version}' google-chrome-stable 2>/dev/null) || exit 0
        [[ -n "$version" && -n "${ImageOS:-}" && -n "${ImageVersion:-}" && -x /opt/google/chrome/google-chrome ]] || exit 0
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "key=chrome-runtime-v1-${RUNNER_OS}-${RUNNER_ARCH}-${ImageOS}-${ImageVersion}-${version}" >> "$GITHUB_OUTPUT"

    - name: Restore installed Chrome files
      id: cache
      if: steps.package.outputs.key != ''
      continue-on-error: true
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/hp-browser-runtime
        key: ${{ steps.package.outputs.key }}
        lookup-only: ${{ inputs.save-cache == 'true' }}

    # A single producer pays the cold copy cost. Consumers never download a
    # different browser or modify the runner's system installation.
    - name: Copy installed Chrome on a cache miss
      id: copy
      if: inputs.save-cache == 'true' && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      shell: bash
      env:
        PACKAGE_VERSION: ${{ steps.package.outputs.version }}
      run: |
        mkdir -p "$RUNNER_TEMP/hp-browser-runtime"
        cp -R --preserve=mode,timestamps /opt/google/chrome/. "$RUNNER_TEMP/hp-browser-runtime/"
        printf '%s\n' "$PACKAGE_VERSION" > "$RUNNER_TEMP/hp-browser-runtime/.hp-package-version"

    - name: Save installed Chrome files
      if: inputs.save-cache == 'true' && steps.copy.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/hp-browser-runtime
        key: ${{ steps.package.outputs.key }}

    - name: Select restored Chrome
      if: inputs.save-cache != 'true' && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        PACKAGE_VERSION: ${{ steps.package.outputs.version }}
      run: |
        fallback() {
          printf '::notice::System Chrome fallback: %s\n' "$1"
          exit 0
        }
        browser_dir="$RUNNER_TEMP/hp-browser-runtime"
        [[ -f "$browser_dir/.hp-package-version" && -x "$browser_dir/google-chrome" && -x "$browser_dir/chrome" ]] || fallback "cached files missing or not executable"
        [[ "$(cat "$browser_dir/.hp-package-version")" == "$PACKAGE_VERSION" ]] || fallback "cached package version mismatch"
        # Sandboxed launches need the runner's system Chrome. The launcher may
        # use this cache only when the caller already requested --no-sandbox.
        echo "HP_CACHED_CHROMIUM_PATH=$browser_dir/google-chrome" >> "$GITHUB_ENV"
        # Extraction has already read and written the executable; retain the
        # normal blank-browser warmup without a second sequential file preload.
        echo 'HP_BROWSER_PRELOAD=0' >> "$GITHUB_ENV"
        echo 'Cached Chrome available only for explicit --no-sandbox launches; system browser retained for sandboxed launches'
