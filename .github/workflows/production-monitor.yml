name: Production SEO and stability monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-monitor
  cancel-in-progress: true

jobs:
  probe:
    name: External crawl and runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout monitor
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Probe production
        env:
          PRODUCTION_BASE_URL: https://arena.hs-manacost.ru
          MONITOR_ATTEMPTS: '2'
          MONITOR_RETRY_DELAY_MS: '5000'
          MONITOR_TIMEOUT_MS: '10000'
          MONITOR_DEADLINE_MS: '240000'
        run: node scripts/production-monitor.mjs
