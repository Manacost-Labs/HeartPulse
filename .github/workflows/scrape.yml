name: Validate scraper manually

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: read

# ─── Job ──────────────────────────────────────────────────────────────────────
jobs:
  scrape-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # kill the job if scraping hangs

    steps:
      # Production publishing is owned by hs-arena-scraper.timer on the host.
      # This workflow is a read-only, operator-triggered upstream diagnostic.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Install all dependencies.
      # puppeteer@25.4.0 downloads the workflow's isolated Chrome during npm ci.
      - name: Install dependencies
        run: npm ci

      - name: Resolve Puppeteer browser
        shell: bash
        run: |
          browser_path=$(node --input-type=module -e "import puppeteer from 'puppeteer'; process.stdout.write(await puppeteer.executablePath())")
          [[ "$browser_path" == /* ]] || { echo "Puppeteer returned a non-absolute browser path" >&2; exit 2; }
          [[ -x "$browser_path" ]] || { echo "Puppeteer browser is not executable" >&2; exit 2; }
          printf 'PUPPETEER_EXECUTABLE_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"

      - name: Scrape data
        env:
          BLIZZARD_CLIENT_ID:     ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: npm run scrape
