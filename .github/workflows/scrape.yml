name: Validate scraper manually

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

# ─── Permissions ──────────────────────────────────────────────────────────────
permissions:
  contents: read

# ─── Job ──────────────────────────────────────────────────────────────────────
jobs:
  scrape-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # kill the job if scraping hangs

    steps:
      # Production publishing is owned by hs-arena-scraper.timer on the host.
      # This workflow is a read-only, operator-triggered upstream diagnostic.
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Install all dependencies.
      #    puppeteer@22 downloads Chrome automatically during npm ci
      #    UNLESS PUPPETEER_SKIP_DOWNLOAD=true — we intentionally do NOT set
      #    that variable here (it's set in vercel.json only for the Vercel build).
      - name: Install dependencies
        run: npm ci

      - name: Scrape data
        env:
          BLIZZARD_CLIENT_ID:     ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: npm run scrape
