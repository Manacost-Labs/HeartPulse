name: Validate and deploy application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Typecheck, test, build and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Run release-blocking validation
        run: npm run verify:release

      - name: Create immutable production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run release:create -- --output="$RUNNER_TEMP/release-$GITHUB_SHA" --sha="$GITHUB_SHA"

      - name: Upload immutable production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: hs-arena-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  browser-observatory:
    name: Full browser observatory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full browser observatory
        run: npm run qa:ci

  deploy-production:
    name: Deploy validated release to production
    needs: [validate, browser-observatory]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, hs-arena-production]
    timeout-minutes: 25
    environment:
      name: production
      url: https://hearthpulse.net
    concurrency:
      group: hs-arena-production
      cancel-in-progress: false

    steps:
      - name: Checkout release monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Download validated release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hs-arena-release-${{ github.sha }}
          path: ${{ runner.temp }}/hs-arena-release-${{ github.sha }}

      - name: Deploy exact validated SHA
        id: deployment
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/hs-arena-release-$GITHUB_SHA"
          sudo /usr/local/sbin/hs-arena-ci-deploy --require-capability=scraper-runtime-probe-v1 "$artifact" "$GITHUB_SHA"

      - name: Verify exact release availability
        env:
          PRODUCTION_BASE_URL: https://hearthpulse.net
          PRODUCTION_MONITOR_PROFILE: release
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          MONITOR_ATTEMPTS: '3'
          MONITOR_RETRY_DELAY_MS: '10000'
          MONITOR_TIMEOUT_MS: '10000'
          MONITOR_DEADLINE_MS: '480000'
        run: node scripts/production-monitor.mjs

      - name: Observe data freshness separately
        if: always() && steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PRODUCTION_BASE_URL: https://hearthpulse.net
          PRODUCTION_MONITOR_PROFILE: freshness
          MONITOR_ATTEMPTS: '2'
          MONITOR_RETRY_DELAY_MS: '5000'
          MONITOR_TIMEOUT_MS: '10000'
          MONITOR_DEADLINE_MS: '120000'
        run: node scripts/production-monitor.mjs
