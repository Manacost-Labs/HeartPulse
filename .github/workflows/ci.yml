name: Validate and deploy application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, build and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Run release-blocking validation
        run: npm run verify:release

      - name: Create immutable production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run release:create -- --output="$RUNNER_TEMP/release-$GITHUB_SHA" --sha="$GITHUB_SHA"

      - name: Upload immutable production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: hs-arena-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  browser-observatory:
    name: Full browser observatory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run full browser observatory
        run: npm run qa:ci

  deploy-production:
    name: Deploy validated release to production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, hs-arena-production]
    timeout-minutes: 15
    environment:
      name: production
      url: https://arena.hs-manacost.ru
    concurrency:
      group: hs-arena-production
      cancel-in-progress: false

    steps:
      - name: Download validated release
        uses: actions/download-artifact@v8
        with:
          name: hs-arena-release-${{ github.sha }}
          path: ${{ runner.temp }}/hs-arena-release-${{ github.sha }}

      - name: Deploy exact validated SHA
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/hs-arena-release-$GITHUB_SHA"
          sudo /usr/local/sbin/hs-arena-ci-deploy "$artifact" "$GITHUB_SHA"
