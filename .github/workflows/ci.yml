name: Validate and deploy application

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      clean_code_base:
        description: Optional Git ref or SHA used as the clean-code diff base
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The merge queue fast-forwards main to the exact commit it validated. A push
  # of such a commit deploys the release that queue run packaged instead of
  # validating and building the same tree twice; anything else validates here.
  reuse:
    name: Reuse merge-queue validation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Find the merge-queue run of this commit
        id: find
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/find-validated-release.mjs

  # Build once: every test job below downloads these exact outputs, and the
  # production release is packaged from the same workspace, so the deployed
  # bytes are the bytes the shards validated.
  build:
    name: Build release artifacts
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies
        with:
          save-cache: 'true'

      # Webpack's persistent cache; Next.js invalidates stale entries itself.
      - name: Restore Next.js build cache
        uses: actions/cache/restore@v6
        with:
          path: apps/public-web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build and smoke-test release inputs
        run: npm run verify:release:build

      # Only main (and manual runs) save: other refs' caches are invisible to
      # every other branch and would just evict main's.
      - name: Save Next.js build cache
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache/save@v6
        with:
          path: apps/public-web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      - name: Upload validated build outputs
        uses: actions/upload-artifact@v7
        with:
          name: build-outputs-${{ github.sha }}
          path: |
            build
            dist
            apps/public-web/.next
            !apps/public-web/.next/cache
          if-no-files-found: error
          # Long enough to re-run a failed shard the next day without a rebuild.
          retention-days: 3
          # A full re-run rebuilds the same SHA and replaces the first attempt's outputs.
          overwrite: true
          include-hidden-files: true

      # The merge queue packages the release too, so the push that lands its
      # commit on main can deploy it without rebuilding (see the reuse job).
      - name: Create immutable production release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group'
        run: npm run release:create -- --output="$RUNNER_TEMP/release-$GITHUB_SHA" --sha="$GITHUB_SHA"

      - name: Upload immutable production release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'merge_group'
        uses: actions/upload-artifact@v7
        with:
          name: hs-arena-release-${{ github.sha }}
          path: ${{ runner.temp }}/release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
          # A full re-run repackages the same SHA; deploy reads the current attempt.
          overwrite: true
          # release:create allowlists shipped files; .next must survive artifact upload.
          include-hidden-files: true

  # Storybook is a test input only (never shipped), so it builds beside the
  # release instead of before it.
  storybook:
    name: Build Storybook
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload Storybook build
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static-${{ github.sha }}
          path: storybook-static
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  validate:
    name: Typecheck, lint and static gates
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CLEAN_CODE_EVENT: ${{ github.event_name }}
      CLEAN_CODE_PUSH_BEFORE: ${{ github.event.before }}
      CLEAN_CODE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      CLEAN_CODE_DISPATCH_BASE: ${{ inputs.clean_code_base }}
      # Empty outside the merge queue; there it diffs the whole queued batch.
      CLEAN_CODE_BASE: ${{ github.event.merge_group.base_sha }}
      REACT_DOCTOR_BASE: ${{ github.event.merge_group.base_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Check production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Run release-blocking static checks
        run: npm run verify:release:checks

  test-suites:
    name: Registry suites (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [build, storybook]
    # Explicit: the implicit success() also fails on the skipped reuse job upstream.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.storybook.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    strategy:
      # Every shard reports its own result; one failure must not hide the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Install identity TLS regression tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nginx openssl

      - name: Download validated build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs-${{ github.sha }}

      - name: Download Storybook build
        uses: actions/download-artifact@v8
        with:
          name: storybook-static-${{ github.sha }}
          path: storybook-static

      - name: Run registered non-browser shard
        run: npm run test:suite -- unit,integration,contract,production-smoke --shard ${{ matrix.shard }}/${{ strategy.job-total }} --continue-on-failure

      # The Next bundle budget test writes this; main's copy is the baseline source.
      # Exactly one shard runs that test, so only that shard has a file to upload.
      - name: Upload Next bundle measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: next-bundle-measurements-${{ github.sha }}
          path: tmp/next-bundle-measurements.json
          if-no-files-found: ignore
          retention-days: 30

  browser-tests:
    name: Browser suite (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [build, storybook]
    # Explicit: the implicit success() also fails on the skipped reuse job upstream.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.storybook.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    strategy:
      # Every shard reports its own result; one failure must not hide the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8, 9]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Download validated build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs-${{ github.sha }}

      - name: Download Storybook build
        uses: actions/download-artifact@v8
        with:
          name: storybook-static-${{ github.sha }}
          path: storybook-static

      - name: Run registered browser shard
        run: npm run test:suite -- browser --shard ${{ matrix.shard }}/${{ strategy.job-total }} --retry-failed-once --continue-on-failure --quarantine exclude

  # The registry's quarantined flaky tests, each with an open issue. Reported on
  # every run but never gating: CI required and the deployment do not need it.
  browser-quarantine:
    name: Browser quarantine (non-blocking)
    needs: [build, storybook]
    # Explicit: the implicit success() also fails on the skipped reuse job upstream.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.storybook.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Download validated build outputs
        uses: actions/download-artifact@v8
        with:
          name: build-outputs-${{ github.sha }}

      - name: Download Storybook build
        uses: actions/download-artifact@v8
        with:
          name: storybook-static-${{ github.sha }}
          path: storybook-static

      - name: Run quarantined browser tests
        run: npm run test:suite -- browser --retry-failed-once --continue-on-failure --quarantine only

  # Builds its own Next runtime so it starts with the build instead of after it;
  # the two halves of scripts/e2e-qa.mjs run in parallel.
  browser-observatory:
    name: Full browser observatory (${{ matrix.part }})
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.run-id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      CHROMIUM_PATH: '/usr/bin/google-chrome'
      QA_PART: ${{ matrix.part }}
    strategy:
      fail-fast: false
      matrix:
        part: [routes, interactions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies

      - name: Restore Next.js build cache
        uses: actions/cache/restore@v6
        with:
          path: apps/public-web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run full browser observatory
        run: npm run qa:ci

  # The one stable required check for the merge queue ruleset; shard names may change.
  required:
    name: CI required
    if: always()
    needs: [reuse, build, storybook, validate, test-suites, browser-tests, browser-observatory]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        run: test "${{ needs.reuse.outputs.run-id != '' || (needs.build.result == 'success' && needs.storybook.result == 'success' && needs.validate.result == 'success' && needs.test-suites.result == 'success' && needs.browser-tests.result == 'success' && needs.browser-observatory.result == 'success') }}" = true

  # Keeps main's dependency and Next.js caches current when a reused merge-queue
  # run made the build job unnecessary. Never gates the deployment.
  refresh-caches:
    name: Refresh main build caches
    needs: reuse
    if: needs.reuse.outputs.run-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install locked dependencies
        uses: ./.github/actions/install-dependencies
        with:
          save-cache: 'true'

      - name: Restore Next.js build cache
        uses: actions/cache/restore@v6
        with:
          path: apps/public-web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Rebuild the Next.js runtime
        run: npm run build && npm run build:next

      - name: Save Next.js build cache
        uses: actions/cache/save@v6
        with:
          path: apps/public-web/.next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

  deploy-production:
    name: Deploy validated release to production
    needs: [reuse, build, storybook, validate, test-suites, browser-tests, browser-observatory]
    # Deploys either the release this run validated or, when the reuse job found
    # one, the release the merge queue validated for this exact commit and tree.
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && ((needs.reuse.result == 'success' && needs.reuse.outputs.run-id != '')
      || (needs.build.result == 'success' && needs.storybook.result == 'success' && needs.validate.result == 'success'
      && needs.test-suites.result == 'success' && needs.browser-tests.result == 'success'
      && needs.browser-observatory.result == 'success')) }}
    runs-on: [self-hosted, linux, x64, hs-arena-production]
    permissions:
      actions: read
      contents: read
    timeout-minutes: 25
    environment:
      name: production
      url: https://hearthpulse.net
    concurrency:
      group: hs-arena-production
      cancel-in-progress: false

    steps:
      - name: Checkout release monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Verify installed deploy helper contract
        run: bash deploy/install-hs-arena-deployer.sh --check

      - name: Download validated release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hs-arena-release-${{ github.sha }}
          path: ${{ runner.temp }}/hs-arena-release-${{ github.sha }}
          run-id: ${{ needs.reuse.outputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Deploy exact validated SHA
        id: deployment
        shell: bash
        run: |
          artifact="$RUNNER_TEMP/hs-arena-release-$GITHUB_SHA"
          sudo /usr/local/sbin/hs-arena-ci-deploy --require-capability=scraper-runtime-probe-v1 --allow-nginx-contract-hash=9665026b13ba76d2dfcf3223e2546afe59d39b378361c3bd3d1df66a13d29bcf "$artifact" "$GITHUB_SHA"

      - name: Verify exact release availability
        env:
          PRODUCTION_BASE_URL: https://hearthpulse.net
          PRODUCTION_MONITOR_PROFILE: release
          EXPECTED_RELEASE_SHA: ${{ github.sha }}
          MONITOR_ATTEMPTS: '3'
          MONITOR_RETRY_DELAY_MS: '10000'
          MONITOR_TIMEOUT_MS: '10000'
          MONITOR_DEADLINE_MS: '480000'
        run: node scripts/production-monitor.mjs

      - name: Observe data freshness separately
        if: always() && steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          PRODUCTION_BASE_URL: https://hearthpulse.net
          PRODUCTION_MONITOR_PROFILE: freshness
          MONITOR_ATTEMPTS: '2'
          MONITOR_RETRY_DELAY_MS: '5000'
          MONITOR_TIMEOUT_MS: '10000'
          MONITOR_DEADLINE_MS: '120000'
        run: node scripts/production-monitor.mjs
