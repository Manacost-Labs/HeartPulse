# Pre-cutover public-only CDN host for cdn.hearthpulse.net.
# Only the explicit public path allowlist is proxied; private API and unknown
# paths remain closed by the default 404. The shadow intentionally uses the
# established application upstream until the canonical CDN cutover.

server {
    listen 80;
    listen [::]:80;
    server_name cdn.hearthpulse.net;

    location = /_proxy_health {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "ok hearthpulse cdn shadow\n";
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.hearthpulse.net;
    ssl_certificate /etc/nginx/ssl/hearthpulse.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hearthpulse.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hearthpulse_shadow_cdn_ssl:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/cdn.hearthpulse.net.access.log combined buffer=256k flush=5s;
    error_log /var/log/nginx/cdn.hearthpulse.net.error.log warn;

    add_header Strict-Transport-Security "max-age=300" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /_proxy_health {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "ok hearthpulse cdn shadow\n";
    }

    location ~ ^/(?:api/card-image/|assets/|fonts/|(?:ad|archetype-art|bg-legacy|class_icon|constructed-filter-icons|generated|main_assets|site-icons|source-logos|wallpaper)/|runtime-config\.js$|apple-touch-icon\.png$|arena-logo-icon(?:-256)?\.webp$|card-format-(?:standard|wild)\.webp$|favicon(?:-16|-32|-96|-192|_shield)?\.(?:ico|png|svg)$|vacancies\.pdf$) {
        limit_except GET HEAD { deny all; }
        proxy_pass https://hs_arena_origin;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host arena.hs-manacost.ru;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_ssl_server_name on;
        proxy_ssl_name arena.hs-manacost.ru;
        proxy_ssl_verify off;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Timing-Allow-Origin;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Timing-Allow-Origin "*" always;
        add_header X-CDN-Region hearthpulse-shadow always;
        add_header X-Proxy-Cache BYPASS always;
    }

    location / {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }
}
