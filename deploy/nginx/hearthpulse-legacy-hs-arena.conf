# Retired hs-arena.ru names. Their DNS still points at the Moscow edge, which
# answered them with the deckview API until 2026-10-27. They now send visitors,
# links and search engines to HearthPulse in one hop, keeping path and query.
# The certificate is the edge's existing Let's Encrypt lineage for both names,
# made available under /etc/nginx/ssl/hs-arena.ru/
# (docs/runbooks/hearthpulse-edge-caching.md, "Retired hs-arena.ru").

server {
    listen 80;
    listen [::]:80;
    server_name hs-arena.ru www.hs-arena.ru;

    # HTTP-01 renewal of that certificate. The redirect stays inside a
    # location: a server-level `return` would also answer the challenge.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://hearthpulse.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hs-arena.ru www.hs-arena.ru;

    ssl_certificate /etc/nginx/ssl/hs-arena.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hs-arena.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, follow" always;

    return 301 https://hearthpulse.net$request_uri;
}
