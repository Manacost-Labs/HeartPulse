# Shared regional cache capacity. The smallest edge has a 40 GB root volume;
# min_free keeps cache eviction ahead of filesystem exhaustion.
proxy_cache_path /var/cache/nginx/hs-arena levels=1:2 keys_zone=hs_arena_cache:50m max_size=18g inactive=7d min_free=8g use_temp_path=off;

# Anonymous public documents and their RSC payloads (hearthpulse-shadow-app.conf).
# The zone is separate so a document never outlives an hour without a visit and
# never competes with the 18 GB of images and build assets above.
proxy_cache_path /var/cache/nginx/hearthpulse-documents levels=1:2 keys_zone=hearthpulse_documents:20m max_size=1g inactive=1h use_temp_path=off;

# A request that carries any cookie or credential never reads or fills the
# shared document copy: guests receive no cookie, and a signed-in visitor keeps
# the origin's own rendering.
map "$http_cookie$http_authorization" $hearthpulse_document_private_request {
    "" 0;
    default 1;
}

# The document key joins these request headers with `|` before the URI. The
# join is unambiguous only while no header part contains `|`, so any other
# request (and any RSC or prefetch value other than empty or `1`) bypasses the
# copy instead of sharing a key with a different request.
map "$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree|$http_next_url" $hearthpulse_document_unkeyable_request {
    "~^1?\|1?\|[^|]*\|[^|]*\|[^|]*$" 0;
    default 1;
}

# Only a response the application marks as an anonymous public document
# (apps/public-web/documentCaching.mjs), whose type is HTML or an RSC payload
# and whose Vary names exactly the request headers in the cache key, may be
# stored. Next answers some internal requests with a bare `{}` that still
# carries the marker but no type and a shorter Vary; it must never replace a
# document.
map "$upstream_http_x_hearthpulse_edge_cache|$upstream_http_content_type|$upstream_http_vary" $hearthpulse_document_not_shared {
    "~^anonymous\|text/(?:html|x-component)(?:;[^|]*)?\|rsc, next-router-state-tree, next-router-prefetch, next-router-segment-prefetch(?:, Accept-Encoding)+$" 0;
    default 1;
}
