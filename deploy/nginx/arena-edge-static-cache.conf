# Shared static-file proxy policy for every arena.hs-manacost.ru edge node.
#
# The enclosing HTTPS server must define `$arena_proxy_region` and the
# `hs_arena_origin` upstream. Browser cache headers deliberately come from the
# origin: an edge must never turn an upstream 404/no-store response into an
# immutable response.
#
# This longer prefix overrides the generic `location ^~ /api/` bypass in the
# edge vhost. The source-version query makes each successful response
# immutable while missing images retain the origin's no-store policy.
location ^~ /api/card-image/ {
    proxy_pass https://hs_arena_origin;
    proxy_cache hs_arena_cache;
    proxy_cache_key "$scheme:$request_method:$host:$request_uri";
    proxy_cache_valid 200 30d;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}

location ^~ /api/public-resource/ {
    proxy_pass https://hs_arena_origin;
    proxy_cache hs_arena_cache;
    proxy_cache_key "$scheme:$request_method:$host:$request_uri";
    proxy_cache_valid 200 206 30d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}

location ~* \.(?:css|js|mjs|json|xml|txt|svg|woff2?|ttf|otf|eot|avif|webp|jpe?g|png|gif|ico|bmp|mp4|webm|pdf|zip)$ {
    proxy_pass https://hs_arena_origin;
    proxy_cache hs_arena_cache;
    proxy_cache_key "$scheme:$request_method:$host:$request_uri";
    proxy_cache_valid 200 301 302 30d;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}
