# Shared local-first policy for card images, public resources, and frontend
# assets. The enclosing HTTPS server defines `$arena_proxy_region`,
# `$arena_alt_svc`, and the `hs_arena_origin` upstream.

location ^~ /api/card-image/ {
    root /srv/arena/card-images/current;
    try_files $arena_card_image_blizzard_file @arena_card_image_local_fallback;
    access_log off;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header X-Card-Image-Source blizzard always;
    add_header Alt-Svc $arena_alt_svc always;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache LOCAL always;
}

location @arena_card_image_local_fallback {
    root /srv/arena/card-images/current;
    try_files $arena_card_image_fallback_file @arena_card_image_local_placeholder;
    access_log off;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
    add_header X-Card-Image-Source fallback always;
    add_header Alt-Svc $arena_alt_svc always;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache LOCAL always;
}

location @arena_card_image_local_placeholder {
    root /srv/arena/card-images/current;
    try_files $arena_card_image_placeholder_file @arena_card_image_origin;
    access_log off;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
    add_header X-Card-Image-Source placeholder always;
    add_header Alt-Svc $arena_alt_svc always;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache LOCAL always;
}

location @arena_card_image_origin {
    proxy_pass https://hs_arena_origin;
    proxy_cache hs_arena_cache;
    proxy_cache_key "$scheme:$request_method:$host:$request_uri";
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Alt-Svc $arena_alt_svc always;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}

location ^~ /api/public-resource/ {
    proxy_pass https://hs_arena_origin;
    proxy_cache hs_arena_cache;
    proxy_cache_key "$scheme:$request_method:$host:$request_uri";
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Alt-Svc $arena_alt_svc always;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}

# Search metadata changes independently from hashed frontend assets. Keep it
# local where possible, but never mark generated sitemap responses immutable.
location = /robots.txt {
    root /srv/arena/static/current;
    try_files $uri @arena_mutable_static_origin;
    add_header Cache-Control "public, max-age=300" always;
    add_header Alt-Svc $arena_alt_svc always;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache LOCAL always;
}

location = /sitemap.xml {
    try_files /__arena_no_local_sitemap__ @arena_mutable_static_origin;
}

location ^~ /sitemaps/ {
    try_files /__arena_no_local_sitemap__ @arena_mutable_static_origin;
}

location @arena_mutable_static_origin {
    proxy_pass https://hs_arena_origin;
    proxy_cache hs_arena_cache;
    proxy_cache_key "$scheme:$request_method:$host:$request_uri";
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=300" always;
    add_header Alt-Svc $arena_alt_svc always;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}

# The runtime feature switch changes independently of immutable frontend
# assets. Always fetch it from the origin so enabling or rolling back the CDN
# is visible immediately on every regional edge.
location = /runtime-config.js {
    proxy_pass https://hs_arena_origin;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    add_header Alt-Svc $arena_alt_svc always;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache BYPASS always;
}

location ~* \.(?:css|js|mjs|json|xml|txt|svg|woff2?|ttf|otf|eot|avif|webp|jpe?g|png|gif|ico|bmp|mp4|webm|pdf|zip)$ {
    root /srv/arena/static/current;
    try_files $uri @arena_static_origin;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header Alt-Svc $arena_alt_svc always;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache LOCAL always;
}

location @arena_static_origin {
    proxy_pass https://hs_arena_origin;
    proxy_cache hs_arena_cache;
    proxy_cache_key "$scheme:$request_method:$host:$request_uri";
    proxy_cache_valid 200 301 302 30d;
    proxy_cache_lock on;
    proxy_cache_background_update on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Alt-Svc $arena_alt_svc always;
    add_header X-Proxy-Region $arena_proxy_region always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}
