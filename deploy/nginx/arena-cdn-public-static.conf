# Public-only static plane for cdn.arena.hs-manacost.ru. Include inside the
# canonical CDN HTTPS server before its default `location / { return 404; }`.
# The CDN server must define the shared `hs_arena_cache` proxy cache.

# Keep compression scoped to the public CDN server. Russian nodes may prefer
# Brotli when available; gzip provides the same contract on the Limburg node.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml application/xml+rss image/svg+xml;

location ^~ /assets/ {
    limit_except GET HEAD { deny all; }
    root /srv/arena/static/current;
    try_files $uri @arena_cdn_immutable_origin;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-Proxy-Cache LOCAL always;
}

location ^~ /fonts/ {
    limit_except GET HEAD { deny all; }
    root /srv/arena/static/current;
    try_files $uri @arena_cdn_immutable_origin;
    access_log off;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-Proxy-Cache LOCAL always;
}

# These directories contain only release-owned public media. Their filenames
# are not uniformly content-hashed, so browsers revalidate sooner.
location ~ ^/(?:ad|archetype-art|bg-legacy|class_icon|constructed-filter-icons|generated|main_assets|site-icons|source-logos|wallpaper)/ {
    limit_except GET HEAD { deny all; }
    root /srv/arena/static/current;
    try_files $uri @arena_cdn_mutable_origin;
    access_log off;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-Proxy-Cache LOCAL always;
}

location ~ ^/(?:apple-touch-icon\.png|arena-logo-icon(?:-256)?\.webp|card-format-(?:standard|wild)\.webp|favicon(?:-16|-32|-96|-192|_shield)?\.(?:ico|png|svg)|vacancies\.pdf)$ {
    limit_except GET HEAD { deny all; }
    root /srv/arena/static/current;
    try_files $uri @arena_cdn_mutable_origin;
    access_log off;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-Proxy-Cache LOCAL always;
}

location @arena_cdn_immutable_origin {
    proxy_pass https://arena.hs-manacost.ru;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host arena.hs-manacost.ru;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_ssl_server_name on;
    proxy_ssl_name arena.hs-manacost.ru;
    proxy_cache hs_arena_cache;
    proxy_cache_key "$uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-CDN-Upstream origin-fallback always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}

location @arena_cdn_mutable_origin {
    proxy_pass https://arena.hs-manacost.ru;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host arena.hs-manacost.ru;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_ssl_server_name on;
    proxy_ssl_name arena.hs-manacost.ru;
    proxy_cache hs_arena_cache;
    proxy_cache_key "$uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 7d;
    proxy_cache_lock on;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-CDN-Upstream origin-fallback always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}
