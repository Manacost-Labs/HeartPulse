# Coarse, privacy-preserving geography derived at the first trusted edge.
# Requires ngx_http_geoip2_module and the monthly DB-IP country database.
geoip2 /var/lib/GeoIP/dbip-country-lite.mmdb {
    auto_reload 1h;
    $arena_geoip_country source=$remote_addr country iso_code;
    $arena_geoip_continent source=$remote_addr continent code;
}

map "$arena_geoip_country:$arena_geoip_continent" $arena_proxy_client_region {
    default unknown;
    ~^RU: russia;
    ~^[A-Z][A-Z]:EU$ europe;
    ~^[A-Z][A-Z]:NA$ north-america;
    ~^[A-Z][A-Z]:SA$ south-america;
    ~^[A-Z][A-Z]:AS$ asia;
    ~^[A-Z][A-Z]:OC$ oceania;
    ~^[A-Z][A-Z]:AF$ africa;
}
