# Derive a bounded Web Vitals region from the immediate trusted proxy socket.
# Never use X-Forwarded-For here: it contains the visitor address and is
# client-controlled before the first trusted proxy. The RF edges reach the
# origin over local SSH reverse tunnels, so their socket address is the origin
# itself. Only in that tunnel case do we accept the region header that the edge
# contract overwrites before proxying the request.
geo $realip_remote_addr $arena_edge_socket_region {
    default unknown;
    127.0.0.1 origin-tunnel;
    ::1 origin-tunnel;
    151.80.21.140 origin-tunnel;
    162.19.220.14 eu-germany-limburg;
    2001:41d0:701:1100::709b eu-germany-limburg;
    194.67.92.242 ru-moscow;
    186.246.28.244 ru-novosibirsk;
}

map "$arena_edge_socket_region:$http_x_arena_edge_region" $arena_edge_region {
    default $arena_edge_socket_region;
    "origin-tunnel:" origin;
    "origin-tunnel:ru-moscow" ru-moscow;
    "origin-tunnel:ru-novosibirsk" ru-novosibirsk;
}
