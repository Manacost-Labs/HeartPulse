# Crash reports from the Hearthpulse desktop app (docs/specs/crash-reports.md). The report is stored without an IP
# address, so the request is not written to the access log either; the upstream still gets X-Real-IP for its
# in-memory rate limit only. Include in the canonical HTTPS server before arena-html-routing.conf.
location = /api/v1/crash-reports {
    include /etc/nginx/snippets/arena-security-headers.conf;
    access_log off;
    client_max_body_size 40k;
    add_header Cache-Control "no-store" always;
    # The Express API (as /api/ in arena-html-routing.conf), not the Boosty sign-in service on 18082.
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_intercept_errors off;
}
