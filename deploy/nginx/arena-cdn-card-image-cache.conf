# Local-first card-image plane for cdn.arena.hs-manacost.ru. Include this
# snippet inside the canonical CDN HTTPS server before its default 404 route.
# The enclosing server must define `$arena_proxy_region` and the shared
# `hs_arena_cache` proxy cache. Card path maps are defined by
# arena-card-local-maps.conf in the http context.

location ^~ /api/card-image/ {
    limit_except GET HEAD { deny all; }
    root /srv/arena/card-images/current;
    try_files $arena_card_image_blizzard_file @arena_cdn_card_image_local_fallback;
    access_log off;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-Card-Image-Source blizzard always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-CDN-Upstream local-mirror always;
    add_header X-Proxy-Cache LOCAL always;
}

location @arena_cdn_card_image_local_fallback {
    root /srv/arena/card-images/current;
    try_files $arena_card_image_fallback_file @arena_cdn_card_image_local_placeholder;
    access_log off;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-Card-Image-Source fallback always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-CDN-Upstream local-mirror always;
    add_header X-Proxy-Cache LOCAL always;
}

location @arena_cdn_card_image_local_placeholder {
    root /srv/arena/card-images/current;
    try_files $arena_card_image_placeholder_file @arena_cdn_card_image_timeweb;
    access_log off;
    add_header Content-Disposition "inline" always;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600" always;
    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-Card-Image-Source placeholder always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-CDN-Upstream local-mirror always;
    add_header X-Proxy-Cache LOCAL always;
}

location @arena_cdn_card_image_timeweb {
    proxy_pass https://xa3umh5n3j.cdn.twcstorage.ru;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host xa3umh5n3j.cdn.twcstorage.ru;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_hide_header Alt-Svc;
    proxy_hide_header X-Proxy-Cache;
    proxy_hide_header X-Proxy-Region;
    proxy_ssl_server_name on;
    proxy_ssl_name xa3umh5n3j.cdn.twcstorage.ru;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_intercept_errors on;
    error_page 404 500 502 503 504 = @arena_cdn_card_image_origin;

    proxy_cache hs_arena_cache;
    proxy_cache_key "$request_method:$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 30d;
    proxy_cache_valid 404 1m;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-CDN-Upstream timeweb always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}

location @arena_cdn_card_image_origin {
    proxy_pass https://arena.hs-manacost.ru;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host arena.hs-manacost.ru;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_ssl_server_name on;
    proxy_ssl_name arena.hs-manacost.ru;
    proxy_hide_header Alt-Svc;
    proxy_hide_header X-Proxy-Cache;
    proxy_hide_header X-Proxy-Region;

    proxy_cache hs_arena_cache;
    proxy_cache_key "$request_method:$request_uri";
    proxy_cache_methods GET HEAD;
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    add_header Access-Control-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Timing-Allow-Origin "https://arena.hs-manacost.ru" always;
    add_header X-CDN-Region $arena_proxy_region always;
    add_header X-CDN-Upstream origin-fallback always;
    add_header X-Proxy-Cache $upstream_cache_status always;
}
