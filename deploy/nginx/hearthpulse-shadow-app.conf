# Canonical application host for hearthpulse.net.
# The origin transport still uses the established arena.hs-manacost.ru SNI and
# Host contract, while X-Forwarded-Host preserves the public HearthPulse host.

server {
    listen 80;
    listen [::]:80;
    server_name hearthpulse.net;

    location = /_proxy_health {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "ok hearthpulse canonical\n";
    }

    location / {
        return 301 https://hearthpulse.net$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.hearthpulse.net;

    location / {
        return 301 https://hearthpulse.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hearthpulse.net;

    ssl_certificate /etc/nginx/ssl/hearthpulse.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hearthpulse.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hearthpulse_shadow_ssl:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/hearthpulse.net.access.log combined buffer=256k flush=5s;
    error_log /var/log/nginx/hearthpulse.net.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host arena.hs-manacost.ru;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_name arena.hs-manacost.ru;
    proxy_ssl_verify off;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_redirect https://arena.hs-manacost.ru/ https://hearthpulse.net/;
    proxy_connect_timeout 2s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;
    proxy_buffering on;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 256k;

    location = /_proxy_health {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "ok hearthpulse canonical\n";
    }

    location / {
        proxy_pass https://hs_arena_origin;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        sub_filter_types application/json;
        sub_filter 'https://cdn.arena.hs-manacost.ru' 'https://cdn.hearthpulse.net';
        sub_filter 'https://arena.hs-manacost.ru' 'https://hearthpulse.net';
        sub_filter_once off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Proxy-Cache BYPASS always;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hearthpulse.net;

    ssl_certificate /etc/nginx/ssl/hearthpulse.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hearthpulse.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hearthpulse_www_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        return 301 https://hearthpulse.net$request_uri;
    }
}
