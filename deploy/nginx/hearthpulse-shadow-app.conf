# Canonical application host for hearthpulse.net.
# The origin transport still uses the established arena.hs-manacost.ru SNI and
# Host contract, while X-Forwarded-Host preserves the public HearthPulse host.

# Identity must never borrow a legacy, unverified or cross-SNI TLS connection.
# Keep its peer failure state separate too; each request verifies a fresh socket.
upstream hearthpulse_identity_origin {
    zone hearthpulse_identity_origin 64k;
    server 127.0.0.1:18443 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:18444 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:18445 max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    listen [::]:80;
    server_name hearthpulse.net;

    location = /_proxy_health {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "ok hearthpulse canonical\n";
    }

    location / {
        return 301 https://hearthpulse.net$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.hearthpulse.net;

    location / {
        return 301 https://hearthpulse.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hearthpulse.net;

    # Owned by the manacost MCP project and installed on every edge with it.
    include /etc/nginx/snippets/manacost-mcp-edge.conf;
    ssl_certificate /etc/nginx/ssl/hearthpulse.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hearthpulse.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hearthpulse_shadow_ssl:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/hearthpulse.net.access.log combined buffer=256k flush=5s;
    error_log /var/log/nginx/hearthpulse.net.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host arena.hs-manacost.ru;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP $remote_addr;
    proxy_set_header Accept-Encoding "";
    # Next-internal request headers change what Next renders without being part
    # of the document cache key (a pages-router prefetch answers `{}`, a CSP
    # header sets script nonces). No browser of this App Router site sends
    # them, so they never reach the origin from here.
    proxy_set_header X-Middleware-Prefetch "";
    proxy_set_header X-Nextjs-Data "";
    proxy_set_header Next-Hmr-Refresh "";
    proxy_set_header Content-Security-Policy "";
    proxy_set_header Content-Security-Policy-Report-Only "";
    proxy_ssl_server_name on;
    proxy_ssl_name arena.hs-manacost.ru;
    proxy_ssl_verify off;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_redirect https://arena.hs-manacost.ru/ https://hearthpulse.net/;
    proxy_connect_timeout 2s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 10s;
    proxy_buffering on;
    proxy_buffers 32 32k;
    proxy_busy_buffers_size 128k;
    proxy_temp_file_write_size 256k;

    location = /_proxy_health {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "ok hearthpulse canonical\n";
    }

    # OIDC interaction values must retain the provider's redirect and dynamic
    # privacy headers unchanged; the general page proxy below may rewrite them.
    location = /identity {
        access_log off;
        error_log /dev/null crit;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-store" always;
        return 400;
    }

    location ^~ /identity/ {
        access_log off;
        error_log /dev/null crit;
        proxy_pass https://hearthpulse_identity_origin;
        proxy_set_header Connection close;
        proxy_set_header Host arena.hs-manacost.ru;
        proxy_set_header X-Forwarded-Host hearthpulse.net;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name arena.hs-manacost.ru;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/ssl/hearthpulse-identity-origin-ca.crt;
        proxy_pass_header Referrer-Policy;
        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_cache off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_buffering off;
        proxy_next_upstream off;
        # Location headers suppress the server defaults; omit Referrer-Policy
        # so the upstream interaction can select no-referrer or same-origin.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Content-hashed build assets and the public static files never change at a
    # URL (the origin marks them immutable). Keeping a copy on the edge saves a
    # Russian visitor the origin tunnel, about 45 ms per file. Only responses
    # the origin allows to be cached are stored, and only under this host's key.
    location ^~ /_next/static/ {
        proxy_pass https://hs_arena_origin;
        proxy_cache hs_arena_cache;
        proxy_cache_key "hearthpulse:$request_uri";
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie Vary;
        # A location with its own proxy_hide_header drops the server-level list.
        proxy_hide_header Set-Cookie;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/javascript text/css;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    location ~ ^/(?:assets/|fonts/|(?:ad|archetype-art|auth-icons|bg-legacy|class_icon|constructed-filter-icons|generated|main_assets|site-icons|source-logos|uploads|wallpaper)/|apple-touch-icon\.png$|arena-logo-icon(?:-256)?\.webp$|hearthpulse-logo\.webp$|card-format-(?:standard|wild)\.webp$|favicon(?:-16|-32|-96|-192|_shield)?\.(?:ico|png|svg)$) {
        limit_except GET HEAD { deny all; }
        proxy_pass https://hs_arena_origin;
        proxy_cache hs_arena_cache;
        proxy_cache_key "hearthpulse:$request_uri";
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie Vary;
        # A location with its own proxy_hide_header drops the server-level list.
        proxy_hide_header Set-Cookie;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/javascript text/css image/svg+xml;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    # Article covers and proxied wiki art are public, cookie-independent images
    # that Express marks `public, max-age=86400, stale-while-revalidate`.
    # Keeping them here spares each one the origin tunnel; only what the origin
    # allows is stored, and its errors are fetched again.
    location ~ ^/api/(?:article-cover$|public-resource/) {
        limit_except GET HEAD { deny all; }
        proxy_pass https://hs_arena_origin;
        proxy_cache hs_arena_cache;
        proxy_cache_key "hearthpulse:$request_uri";
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Set-Cookie Vary;
        # A location with its own proxy_hide_header drops the server-level list.
        proxy_hide_header Set-Cookie;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Proxy-Cache $upstream_cache_status always;
    }

    # Origin responses arrive uncompressed for host rewriting. Compress only
    # public build assets; authenticated HTML keeps its existing policy.
    location ^~ /_next/ {
        proxy_pass https://hs_arena_origin;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types application/javascript text/css;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Proxy-Cache BYPASS always;
    }

    # Express answers per viewer and owns its own caching. These requests stay
    # outside the document cache: a lookup there would also queue identical
    # cookieless calls behind `proxy_cache_lock`. A plain prefix keeps the
    # public-media regex above in front of it.
    location /api/ {
        proxy_pass https://hs_arena_origin;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        sub_filter_types application/json;
        sub_filter 'https://cdn.arena.hs-manacost.ru' 'https://cdn.hearthpulse.net';
        sub_filter 'https://arena.hs-manacost.ru' 'https://hearthpulse.net';
        sub_filter_once off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Proxy-Cache BYPASS always;
    }

    # Every uncached document costs two or three round trips through the origin
    # tunnel (0.6-1.4 s measured on a miss). An anonymous public document and
    # its RSC payload are therefore kept here for a minute, five for the ISR
    # pages below. Only the 200 of a cookieless request that the application
    # marks `anonymous` with the expected type and Vary is stored
    # (arena-edge-cache-path.conf); a request with a cookie neither reads nor
    # fills the copy. An expired copy is answered at once while one background
    # request refreshes it. Every copy belongs to a ten-minute epoch of the key,
    # so no copy is served after its epoch, not even while the origin fails or
    # after a page was removed or lost its marker. The browser still receives
    # `private, no-cache`;
    # docs/specs/public-document-caching.md.
    location / {
        proxy_pass https://hs_arena_origin;
        proxy_cache hearthpulse_documents;
        # The epoch and the header parts first: none may contain `|` (see the
        # maps), so the URI after the sixth `|` cannot shift a boundary.
        proxy_cache_key "hearthpulse-document:$hearthpulse_document_epoch|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree|$http_next_url|$request_uri";
        proxy_cache_valid 200 60s;
        # With a background update nginx answers an expired copy even when the
        # refresh fails (502, 404, a lost marker) and never bounds its age; the
        # epoch in the key does. Never `error` or `timeout`: the first request
        # of an epoch, and every request without a copy, sees the origin's own
        # answer.
        # `updating` alone already sends one refresh per expired copy.
        proxy_cache_use_stale updating;
        proxy_cache_background_update on;
        # No proxy_cache_lock: the origin answers in milliseconds, the cost is
        # the tunnel trip that every waiter pays anyway, and nginx re-checks a
        # lock only every 500 ms. Identical cookieless requests that are never
        # stored (`/?login`, unmarked routes, their RSC prefetches, redirects)
        # would queue one after another for up to the lock timeout.
        # `private, no-cache` addresses browsers; the marker decides for the edge.
        # Vary is checked in the map instead: Accept-Encoding never reaches the
        # origin, and the other Vary headers are part of the key.
        proxy_ignore_headers Cache-Control Expires Vary;
        proxy_cache_bypass $hearthpulse_document_private_request $hearthpulse_document_unkeyable_request;
        proxy_no_cache $hearthpulse_document_private_request $hearthpulse_document_unkeyable_request $hearthpulse_document_not_shared;
        # A location with its own proxy_hide_header drops the server-level list.
        proxy_hide_header X-HearthPulse-Edge-Cache;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        sub_filter_types application/json;
        sub_filter 'https://cdn.arena.hs-manacost.ru' 'https://cdn.hearthpulse.net';
        sub_filter 'https://arena.hs-manacost.ru' 'https://hearthpulse.net';
        sub_filter_once off;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Proxy-Cache $upstream_cache_status always;

        # ISR pages (`revalidate = 300`) whose HTML holds no server data: Next
        # itself renders them at most every five minutes, and a deploy cannot
        # leave a data-less build copy here. `/standard/meta/` and `/articles/`
        # render data and are regenerated right after a deploy
        # (`/health/next/revalidate/`), so they keep the minute. The list is
        # checked against the routes by tests/hearthpulse-shadow-nginx.test.mjs.
        # Everything else is inherited from `location /`.
        location ~ ^/(?:battlegrounds/tier-list|classes|guides-archive|heroes|legendaries|standard/(?:matchups|vicious-gold)|tierlist)/$ {
            proxy_pass https://hs_arena_origin;
            proxy_cache_valid 200 300s;
        }
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.hearthpulse.net;

    ssl_certificate /etc/nginx/ssl/hearthpulse.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/hearthpulse.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:hearthpulse_www_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        return 301 https://hearthpulse.net$request_uri;
    }
}
