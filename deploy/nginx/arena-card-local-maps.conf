# Resolve validated card-image API paths to stable local filenames. Invalid
# paths map to a guaranteed miss and continue through the origin fallback.
map $uri $arena_card_image_blizzard_file {
    default /__arena_card_image_miss__;
    ~^/api/card-image/([A-Za-z0-9_]+)/(thumb|full)\.webp$ /$1-$2-blizzard.webp;
}

map $uri $arena_card_image_fallback_file {
    default /__arena_card_image_miss__;
    ~^/api/card-image/([A-Za-z0-9_]+)/(thumb|full)\.webp$ /$1-$2-fallback.webp;
}

map $uri $arena_card_image_placeholder_file {
    default /__arena_card_image_miss__;
    ~^/api/card-image/([A-Za-z0-9_]+)/(thumb|full)\.webp$ /missing-$1-$2-placeholder.webp;
}

open_file_cache max=50000 inactive=60s;
open_file_cache_valid 120s;
open_file_cache_min_uses 2;
open_file_cache_errors on;
