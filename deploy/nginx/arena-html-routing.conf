location ~ ^/library/(?:minions|spells|anomalies|quests|rewards|darkmoon-prizes|trinkets|timewarped)(?:/[^/]+-[1-9][0-9]*)?$ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag $arena_auth_query_robots always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 301 $uri/$is_args$args;
}

location ~ ^/library/archive(?:/(?:minions|spells|anomalies|quests|rewards|darkmoon-prizes|trinkets)(?:/[^/]+-[1-9][0-9]*)?)?$ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag $arena_auth_query_robots always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 301 $uri/$is_args$args;
}

# Canonical slash routes prefer a prerendered/snapshot document and otherwise
# fall back to the anonymous SPA shell. Entity existence is intentionally not
# guessed by nginx; authoritative entity 404s belong to a later server resolver.
location ~ ^/(?:articles|faq|gallery|guides-archive|contests|classes|tierlist|legendaries|heroes|library|standard/(?:matchups|meta|vicious-gold|cards)|battlegrounds/(?:tier-list|strategies|tier-builder))/$ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag $arena_auth_query_robots always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri/index.html /index.html =404;
}

location ~ ^/guides-archive/[A-Za-z0-9][A-Za-z0-9._~-]*/$ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag $arena_auth_query_robots always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri/index.html /index.html =404;
}

