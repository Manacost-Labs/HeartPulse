    try_files $uri =404;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

location = / {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag $arena_auth_query_robots always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
}

# A syntactically valid route without a materialized document remains
# navigable for users, but fails closed for crawlers until its entity resolver
# or prerender snapshot is published. This prevents the home document and its
# canonical URL from becoming an indexable soft duplicate.
location @arena_spa_noindex {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, follow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
}

location = /404.html {
    internal;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /404.html =404;
}

# Everything not matched by the inventory-backed rules is an actual 404.
location / {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 404;
}
