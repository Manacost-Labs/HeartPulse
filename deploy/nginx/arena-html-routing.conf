    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

# Preserve any release-owned uploads without exposing other shared-data trees.
location ^~ /uploads/ {
    try_files $uri =404;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
}

# This file is the production feature switch for CDN delivery. It must never
# inherit the immutable JavaScript policy or clients could retain a stale flag
# for a month after an activation or rollback.
location = /runtime-config.js {
    try_files $uri =404;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    access_log off;
}

