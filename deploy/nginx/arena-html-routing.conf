# TODO(SEO-103-referral-redirect): proxy this route to an authoritative server
# redirect handler. Until that handler exists, referral links remain a
# client-resolved legacy route. They are valid, uncached and never indexable.
location ~ ^/r/[A-Za-z0-9][A-Za-z0-9_-]*/?$ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
}

# A guide slug may contain a dot, so the known HTML route regexes intentionally
# precede this generic file rule. Unknown paths with extensions stay real 404s.
location = /yandex_eaea2c59052dad81.html {
    try_files $uri =404;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
}

location ~* \.(?:css|js|mjs|json|xml|txt|svg|woff2?|ttf|otf|eot|avif|webp|jpe?g|png|gif|ico|bmp|mp4|webm|pdf)$ {
    try_files $uri =404;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
}

location = / {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag $arena_auth_query_robots always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /index.html =404;
}

location = /404.html {
    internal;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /404.html =404;
}

# Everything not matched by the inventory-backed rules is an actual 404.
location / {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 404;
}
