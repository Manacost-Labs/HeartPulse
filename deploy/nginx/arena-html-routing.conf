# Versioned HTML routing contract for arena.hs-manacost.ru.
#
# Context: include inside the canonical HTTPS `server` block after setting
# `$root_path`, `root` and the server-wide security headers. Install
# `arena-seo-map.conf` in nginx's `http` context first. This file replaces the
# current API/static/SPA `location` blocks; do not include it alongside them.
# Validate with `nginx -t` before reload.

error_page 404 =404 /404.html;

# Duplicate slashes are normalized without creating a redirect chain.
if ($request_uri ~ "^[^?]*//") {
    return 301 $uri$is_args$args;
}

# Application endpoints always win over HTML routing.
location = /api {
    include /etc/nginx/snippets/arena-security-headers.conf;
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Arena-Edge-Region $arena_edge_region;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ^~ /api/ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, nofollow" always;
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Arena-Edge-Region $arena_edge_region;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

