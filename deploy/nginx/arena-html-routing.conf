}

# Removed product areas must not become SPA soft-404 pages.
location ~ ^/(?:decks|jobs)(?:/.*)?$ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 410;
}

# The admin shell has no canonical URL, but the slash form is the only served
# form. Both the redirect and document carry noindex before JavaScript runs.
location = /admin {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 301 /admin/$is_args$args;
}

