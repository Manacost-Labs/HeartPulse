# Versioned HTML routing contract for arena.hs-manacost.ru.
#
# Context: include inside the canonical HTTPS `server` block after setting
# `$root_path`, `root` and the server-wide security headers. Install
# `arena-seo-map.conf` in nginx's `http` context first. This file replaces the
# current API/static/SPA `location` blocks; do not include it alongside them.
# Validate with `nginx -t` before reload.

error_page 404 =404 /404.html;

# Duplicate slashes are normalized without creating a redirect chain.
if ($request_uri ~ "^[^?]*//") {
    return 301 $uri$is_args$args;
}

# Application endpoints always win over HTML routing.
location = /api {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ^~ /api/ {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /health {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /health/ {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location = /metrics {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location ^~ /metrics/ {
    proxy_pass http://127.0.0.1:3101;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# SEO control files use a short cache lifetime and never fall back to HTML.
location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
    try_files $uri =404;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;
}

location ^~ /uploads/admin/ {
    alias /var/www/koloda/data/www/hs-arena.ru/shared/server-data/uploads/admin/;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
}

# Preserve any release-owned uploads without exposing other shared-data trees.
location ^~ /uploads/ {
    try_files $uri =404;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
}

location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    access_log off;
}

# Removed product areas must not become SPA soft-404 pages.
location ~ ^/(?:decks|jobs)(?:/.*)?$ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 410;
}

# The admin shell has no canonical URL, but the slash form is the only served
# form. Both the redirect and document carry noindex before JavaScript runs.
location = /admin {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 301 /admin/$is_args$args;
}

location = /admin/ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files /admin/index.html /index.html =404;
}

# Canonical public list/detail routes without the required trailing slash.
location ~ ^/(?:articles|faq|gallery|guides-archive|contests|classes|tierlist|legendaries|heroes|library|standard/(?:matchups|meta|vicious-gold|cards)|battlegrounds/(?:tier-list|strategies|tier-builder))$ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag $arena_auth_query_robots always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 301 $uri/$is_args$args;
}

location ~ ^/guides-archive/[A-Za-z0-9][A-Za-z0-9._~-]*$ {
    include /etc/nginx/snippets/arena-security-headers.conf;
    add_header X-Robots-Tag $arena_auth_query_robots always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    return 301 $uri/$is_args$args;
}

