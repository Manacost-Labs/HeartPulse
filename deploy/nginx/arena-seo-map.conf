# Install this file in nginx's `http` context before including
# `arena-html-routing.conf` in the canonical HTTPS server.
#
# The value is deliberately empty for normal requests: nginx suppresses an
# `add_header` whose value is empty. Query policies are route-aware and mirror
# `src/shared/seo/publicRouteInventory.json`, so authentication/admin states are
# noindex,nofollow while approved faceted/deep-link states are noindex,follow.
map $request_uri $arena_auth_query_robots {
    default "";
    ~*^/(?:connect/?)?\?(?:[^&]*&)*(?:login|profile|auth|code|state|returnTo|user_code|admin|section|contest|contests)(?:=[^&]*)?(?:&|$) "noindex, nofollow";
    ~*^/(?:articles|guides-archive|standard/cards/(?:standard|wild)|cosmetics/(?:heroes|coins|pets))/?\?(?:[^&]*&)*(?:search|sort|filter|class|set|mechanic|page|direction|perPage|query|q|rarity|category|kind|role|subscription|status)(?:=[^&]*)?(?:&|$) "noindex, follow";
    ~*^/(?:battlegrounds/tier-list|guides-archive)/?\?(?:[^&]*&)*(?:list|source|strategy|q)(?:=[^&]*)?(?:&|$) "noindex, follow";
}

# Public media may be indexed as an image/resource. Every other API response
# remains noindex. nginx suppresses add_header when this map returns empty.
map $uri $arena_api_robots {
    default "noindex, nofollow";
    ~^/api/(?:article-cover$|card-image/|public-resource/) "";
}

# Next renders its 404 metadata but cannot attach a response header from an
# App Router page. Preserve its HTML and status while marking errors noindex.
map $status $arena_next_html_robots_header {
    default "";
    ~^[45][0-9][0-9]$ "noindex, nofollow";
}

# Preserve article facet/query robots while Next supplies authoritative errors.
map $arena_next_html_robots_header $arena_next_articles_robots_header {
    default $arena_auth_query_robots;
    "noindex, nofollow" "noindex, nofollow";
}

# Non-canonical host/scheme servers use this path to combine origin and slash
# normalization into one redirect. Machine, asset, removed and unknown paths
# deliberately keep their original shape and are resolved by the canonical
# HTTPS server without an extra slash hop.
map $request_uri $arena_original_request_path {
    "~^(?<arena_raw_path_value>[^?]*)" $arena_raw_path_value;
    default $uri;
}

map $uri $arena_canonical_edge_path {
    default $uri;
    "~^/(?:admin|archetypes|articles|faq|privacy|terms|gallery|guides-archive|contests|connect|deck-builder|classes|tierlist|legendaries|heroes|library|developers/api|cosmetics(?:/(?:heroes|coins|pets))?|standard/(?:matchups|meta|archetypes|vicious-gold|cards|fun-decks)|battlegrounds/(?:tier-list|strategies|tier-builder))$" $uri/;
    "~^/archetypes/(?:[1-9][0-9]*|wild)$" $uri/;
    "~^/guides-archive/[A-Za-z0-9][A-Za-z0-9._~-]*$" $uri/;
    "~^/id/(?:[1-9][0-9]{0,8}|1[0-9]{9}|20[0-9]{8}|21[0-3][0-9]{7}|214[0-6][0-9]{6}|2147[0-3][0-9]{5}|21474[0-7][0-9]{4}|214748[0-2][0-9]{3}|2147483[0-5][0-9]{2}|21474836[0-3][0-9]|214748364[0-7])$" $uri/;
    "~^/profiles/p_[A-Za-z0-9_-]{22}$" $uri/;
    "~^/standard/(?:meta|archetypes)/(?:standard|wild)/[a-z0-9][a-z0-9-]{0,119}$" $uri/;
    "~^/standard/cards/(?:standard|wild)(?:/[A-Za-z0-9_]{2,80})?$" $uri/;
    "~^/standard/cards/(?<arena_edge_card_format>standard|wild)/blizzard:(?<arena_edge_card_dbf>[1-9][0-9]{0,18})/?$" /standard/cards/$arena_edge_card_format/blizzard%3A$arena_edge_card_dbf/;
    # Preserve invalid raw segments: $uri has already decoded percent escapes.
    "~^/standard/cards/(?:standard|wild)/" $arena_original_request_path;
    "~^/cosmetics/(?:heroes|coins|pets)/[A-Za-z0-9_-]{1,100}$" $uri/;
    "~^/heroes/[1-9][0-9]*$" $uri/;
    "~^/library/(?:minions|spells|anomalies|dark-gifts|quests|rewards|darkmoon-prizes|trinkets|timewarped)(?:/[^/]+-[1-9][0-9]*)?$" $uri/;
    "~^/library/archive(?:/(?:minions|spells|anomalies|quests|rewards|darkmoon-prizes|trinkets)(?:/[^/]+-[1-9][0-9]*)?)?$" $uri/;
}
