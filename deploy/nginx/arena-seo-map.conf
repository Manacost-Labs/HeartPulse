# Install this file in nginx's `http` context before including
# `arena-html-routing.conf` in the canonical HTTPS server.
#
# The value is deliberately empty for normal requests: nginx suppresses an
# `add_header` whose value is empty. Query policies are route-aware and mirror
# `config/public-route-inventory.json`, so authentication/admin states are
# noindex,nofollow while approved faceted/deep-link states are noindex,follow.
map $request_uri $arena_auth_query_robots {
    default "";
    ~*^/\?(?:[^&]*&)*(?:login|profile|auth|code|state|returnTo|admin|section|contest|contests)(?:=[^&]*)?(?:&|$) "noindex, nofollow";
    ~*^/(?:articles|guides-archive|standard/cards/(?:standard|wild)|cosmetics/(?:heroes|coins|pets))/?\?(?:[^&]*&)*(?:search|sort|filter|class|set|mechanic|page|direction|perPage|query|q|rarity|category|kind|role|subscription|status)(?:=[^&]*)?(?:&|$) "noindex, follow";
    ~*^/(?:battlegrounds/tier-list|guides-archive)/?\?(?:[^&]*&)*(?:list|source|strategy|q)(?:=[^&]*)?(?:&|$) "noindex, follow";
}

# Non-canonical host/scheme servers use this path to combine origin and slash
# normalization into one redirect. Machine, asset, removed and unknown paths
# deliberately keep their original shape and are resolved by the canonical
# HTTPS server without an extra slash hop.
map $uri $arena_canonical_edge_path {
    default $uri;
    "~^/(?:admin|archetypes|articles|faq|gallery|guides-archive|contests|deck-builder|classes|tierlist|legendaries|heroes|library|cosmetics(?:/(?:heroes|coins|pets))?|standard/(?:matchups|meta|archetypes|vicious-gold|cards|fun-decks)|battlegrounds/(?:tier-list|strategies|tier-builder))$" $uri/;
    "~^/archetypes/(?:[1-9][0-9]*|wild)$" $uri/;
    "~^/guides-archive/[A-Za-z0-9][A-Za-z0-9._~-]*$" $uri/;
    "~^/profiles/p_[A-Za-z0-9_-]{22}$" $uri/;
    "~^/standard/(?:meta|archetypes)/(?:standard|wild)/[a-z0-9][a-z0-9-]{0,119}$" $uri/;
    "~^/standard/cards/(?:standard|wild)(?:/[A-Za-z0-9_]{2,80})?$" $uri/;
    "~^/cosmetics/(?:heroes|coins|pets)/[A-Za-z0-9_-]{1,100}$" $uri/;
    "~^/heroes/[1-9][0-9]*$" $uri/;
    "~^/library/(?:minions|spells|anomalies|quests|rewards|darkmoon-prizes|trinkets|timewarped)(?:/[^/]+-[1-9][0-9]*)?$" $uri/;
    "~^/library/archive(?:/(?:minions|spells|anomalies|quests|rewards|darkmoon-prizes|trinkets)(?:/[^/]+-[1-9][0-9]*)?)?$" $uri/;
}
