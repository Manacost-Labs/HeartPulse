# Former Arena application host. Keep TLS active and preserve the full request
# path and query while search engines and external links move to HearthPulse.

server {
    listen 80;
    listen [::]:80;
    server_name arena.hs-manacost.ru;

    return 301 https://hearthpulse.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arena.hs-manacost.ru;

    ssl_certificate /etc/nginx/ssl/arena.hs-manacost.ru/letsencrypt-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/arena.hs-manacost.ru/letsencrypt-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:arena_legacy_redirect_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, follow" always;

    return 301 https://hearthpulse.net$request_uri;
}
