# Public Tribute callback. The upstream verifies trbt-signature against the
# untouched request body before parsing or storing any event.
location = /api/tribute/webhook {
    include /etc/nginx/snippets/arena-security-headers.conf;
    client_max_body_size 256k;
    proxy_hide_header X-Robots-Tag;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:18082/api/tribute/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_intercept_errors off;
}
